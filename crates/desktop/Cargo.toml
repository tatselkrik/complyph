[package]
name = "complyph-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "complyph"
path = "src/main.rs"

[dependencies]
complyph-checks = { path = "../checks" }
complyph-core = { path = "../core" }
complyph-extract = { path = "../extract" }
complyph-library = { path = "../library" }
serde_json.workspace = true
chrono.workspace = true
eframe.workspace = true
egui-file-dialog.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_Diagnostics_Debug"] }

[dev-dependencies]
tempfile.workspace = true
