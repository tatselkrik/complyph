[package]
name = "complyph-updater"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
complyph-library = { path = "../library" }
complyph-paths = { path = "../paths" }
serde.workspace = true
serde_json.workspace = true
url.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_Security_Isolation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_JobObjects", "Win32_System_Memory"] }

[dev-dependencies]
tempfile.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls"] }
