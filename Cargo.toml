[workspace]
members = ["crates/paths", "crates/extract", "crates/ocr", "crates/checks", "crates/core", "crates/library", "crates/reports", "crates/desktop", "crates/updater"]
default-members = ["crates/desktop"]
exclude = ["vendor/egui-file-dialog"]
resolver = "3"

[workspace.package]
version = "0.11.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
directories = "=6.0.0"
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "x11", "wayland"] }
egui-file-dialog = { version = "=0.16.0", default-features = false, features = ["default_fonts"] }
rusqlite = { version = "=0.43.0", features = ["bundled", "backup"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
thiserror = "2.0"
sha2 = "=0.10.9"
url = "2.5"
pdf-extract = "=0.12.1"
lopdf = { version = "=0.42.0", default-features = false }
quick-xml = "=0.41.0"
zip = { version = "=9.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
regex = "=1.12.4"
ttf-parser = "=0.25.1"
libloading = "=0.8.9"

[patch.crates-io]
egui-file-dialog = { path = "vendor/egui-file-dialog" }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
opt-level = 2
lto = "thin"
strip = true
codegen-units = 8
