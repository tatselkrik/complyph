[package]
name = "egui-file-dialog"
version = "0.16.0"
edition = "2021"
license = "MIT"
authors = ["Jannis Teipel <jannistpl@gmail.com>"]
description = "Customizable egui file dialog; pinned with a LaborLens PH light-theme correction"
repository = "https://github.com/jannistpl/egui-file-dialog"
publish = false

[features]
default = ["serde", "default_fonts"]
default_fonts = ["egui/monochrome_emoji_fonts"]
serde = ["dep:serde"]
information_view = ["dep:chrono", "dep:image-meta", "dep:indexmap"]

[dependencies]
directories = "6.0"
dunce = "1.0.5"
egui = { version = "0.37.0", default-features = false }
sysinfo = { version = "0.40", default-features = false, features = ["disk"] }
serde = { version = "1", features = ["derive"], optional = true }
chrono = { version = "0.4.39", optional = true }
image-meta = { version = "0.1.2", optional = true }
indexmap = { version = "2.7.0", features = ["serde"], optional = true }

