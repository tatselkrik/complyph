name: Desktop and downloader checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Verify Linux downloader isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPLYPH_REQUIRE_LINUX_ISOLATION: "1"
      RUST_TEST_THREADS: "2"
    steps:
      - name: Check out public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component clippy
      - name: Protect the CI resolver runtime files
        run: |
          set -euo pipefail
          for file in /etc/resolv.conf /etc/hosts /etc/nsswitch.conf /etc/gai.conf /etc/host.conf /lib/x86_64-linux-gnu/libnss_dns.so.2 /lib/x86_64-linux-gnu/libnss_files.so.2; do
            if [ -f "$file" ]; then
              stat -Lc '%n %U:%G %a' "$file"
              sudo chown root:root "$file"
              sudo chmod go-w "$file"
            fi
          done
      - name: Test Linux confinement and public-library workflows
        run: cargo test -p complyph-paths -p complyph-library -p complyph-checks -p complyph-updater --locked
      - name: Check Linux Rust warnings
        run: cargo clippy -p complyph-library -p complyph-checks -p complyph-updater --all-targets --locked -- -D warnings
  windows:
    name: Test, build, and install
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Verify downloader isolation
        run: cargo test -p complyph-updater --test isolation --locked
      - name: Prepare bundled offline OCR
        shell: pwsh
        run: ./scripts/prepare-ocr-windows.ps1
      - name: Test local storage and boundaries
        run: cargo test --workspace --locked
      - name: Check Rust warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build Windows executables
        run: cargo build --workspace --release --locked
      - name: Find or install NSIS
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed.' }
          }
      - name: Package the installer and app ZIP
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Verify installation and preservation
        shell: pwsh
        run: ./scripts/test-windows-install.ps1
      - name: Save Windows release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: complyph-windows
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14
