name: Publish verified release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Windows checks run ID
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: complyph-release
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish Windows packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      VERIFIED_RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Verify the source build
        id: verified
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERIFIED_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN_ID" > verified-run.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN_ID/jobs?filter=latest" > verified-jobs.json
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          run = json.loads(Path('verified-run.json').read_text())
          assert str(run['repository']['id']) == os.environ['GITHUB_REPOSITORY_ID']
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['head_branch'] == 'main' and run['event'] == 'push'
          assert run['path'] == '.github/workflows/ci.yml'
          assert re.fullmatch('[0-9a-f]{40}', run['head_sha'])
          jobs = [job for page in json.loads(Path('verified-jobs.json').read_text()) for job in page['jobs']]
          for name in ('Test, build, and install', 'Verify Linux downloader isolation'):
              matches = [job for job in jobs if job['name'] == name]
              assert len(matches) == 1 and matches[0]['conclusion'] == 'success', name
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha=' + run['head_sha'] + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('EXPECTED_COMMIT=' + run['head_sha'] + '\n')
          PY
      - name: Check out the verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.verified.outputs.sha }}
          persist-credentials: false
      - name: Download Windows packages
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$VERIFIED_RUN_ID" --repo "$GITHUB_REPOSITORY" --name complyph-windows --dir release
      - name: Verify source, checksums, and upgrade evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, struct, zipfile
          from pathlib import Path
          root = Path('release')
          manifest = json.loads((root / 'release-manifest.json').read_text(encoding='utf-8-sig'))
          check = json.loads((root / 'windows-install-check.json').read_text(encoding='utf-8-sig'))
          library = json.loads((root / 'starter-library-manifest.json').read_text())
          assert manifest['source_commit'] == check['source_commit'] == os.environ['EXPECTED_COMMIT']
          assert manifest['project'] == 'ComplyPH' and manifest['target'] == 'x86_64-pc-windows-msvc'
          version = manifest['version']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version)
          assert manifest['starter_bundle_id'] == library['bundle_id']
          assert (root / 'starter-library-manifest.json').read_bytes() == Path('library/starter/manifest.json').read_bytes()
          assert len(library['sources']) == check['starter_source_count'] == manifest['starter_source_count'] == 19
          assert len(library['domains']) == check['starter_domain_count'] == manifest['starter_domain_count'] == 7
          for name in ('installed', 'fresh_install_passed', 'legacy_upgrade_passed', 'reinstall_location_preserved', 'legacy_branding_replaced', 'legacy_data_migrated', 'programdata_acl_passed', 'installed_checks_passed', 'shortcuts_verified', 'cli_startup_passed', 'catalog_status_passed', 'installed_reader_passed', 'private_schema_upgrade_passed', 'current_version_upgrade_passed', 'uninstalled', 'private_fixture_preserved', 'catalog_preserved', 'original_preserved'):
              assert check[name] is True, name
          assert check['interactive_windows_ui_tested'] is False
          assert manifest['document_text_reading'] == 'offline PDF and DOCX'
          assert manifest['connected_review'] is True and manifest['offline_exact_provisions'] is True
          assert manifest['manual_legal_source_import'] is True and check['installed_source_import_passed'] is True
          assert manifest['source_update_checks'] is True and manifest['source_change_review'] is True
          assert check['downloader_isolation_passed'] is True
          assert check['updater_no_approval_no_network_passed'] is True
          assert check['public_https_probe_passed'] is True
          assert manifest['public_schema'] == check['public_schema'] == 5
          assert manifest['library_maintenance'] is True and check['installed_library_maintenance_passed'] is True
          for name in ('source_metadata_editing', 'reviewed_source_adoption', 'source_version_comparison', 'official_publication_discovery', 'rule_revalidation_tracking', 'linux_downloader_support'):
              assert manifest[name] is True, name
          maintenance = check['library_maintenance']
          assert maintenance['public_schema'] == 5
          assert manifest['library_maintenance_workflow_cases'] == len(maintenance['workflow_cases']) == 6
          assert {case['name'] for case in maintenance['workflow_cases']} == {'metadata_and_identity','reviewed_version_lifecycle','source_rule_revalidation','changed_support_and_stale_guards','durable_legal_hold','official_publication_discovery'}
          assert all(case['passed'] is True for case in maintenance['workflow_cases'])
          for name in ('installed_metadata_history_passed', 'installed_source_identity_passed', 'installed_source_comparison_passed', 'installed_reviewed_adoption_passed', 'installed_rule_revalidation_passed', 'installed_legal_hold_persistence_passed', 'installed_publication_discovery_passed', 'maintenance_reports_preserved', 'maintenance_private_boundary_passed', 'maintenance_pdf_citations_passed'):
              assert maintenance['checks'][name] is True, name
          assert manifest['synthetic_publication_fixture_count'] == maintenance['synthetic_publication_fixture_count'] == 2
          compiled = hashlib.sha256(b''.join(Path(path).read_bytes() for path in ('crates/checks/src/lib.rs','crates/checks/src/initial.rs','crates/checks/src/initial_rules.json'))).hexdigest()
          assert manifest['compiled_rule_profile_sha256'] == compiled
          assert check['manual_source_count'] == check['awaiting_verification_count'] == 1
          assert manifest['private_schema'] == check['private_schema'] == 6
          assert manifest['reader_engine'] == 'complyph-text-2'
          assert manifest['desktop_quality'] is True and check['installed_desktop_quality_passed'] is True
          desktop = check['desktop_quality']
          assert desktop['profile'] == manifest['desktop_quality_profile'] == 'initial-desktop-quality-v1'
          assert desktop['version'] == version
          assert manifest['desktop_layout_cases'] == len(desktop['layout_cases']) == 12
          assert {(c['physical_width'],c['physical_height'],c['scale']) for c in desktop['layout_cases']} == {(w,h,s) for w,h in [(1280,960),(1920,1080),(2560,1440)] for s in [1.0,1.25,1.5,2.0]}
          assert manifest['desktop_scenarios_per_layout'] == 14
          assert all(c['passed'] is True and c['scenarios'] == 14 for c in desktop['layout_cases'])
          for name in ('compact_review','keyboard_navigation','bounded_dialogs'):
              assert manifest[name] is True, name
          assert manifest['desktop_keyboard_cases'] == len(desktop['keyboard_cases']) == 5
          assert {c['name'] for c in desktop['keyboard_cases']} == {'page_shortcuts_and_focus','scoped_search_and_typing','file_picker_focus_and_dismissal','safe_confirmation_default_and_escape','tab_enter_and_space_activation'}
          assert manifest['desktop_recovery_cases'] == len(desktop['recovery_cases']) == 3
          assert {c['name'] for c in desktop['recovery_cases']} == {'missing_original_and_retry','malformed_original_blocks_review','repaired_reading_preserves_history'}
          assert all(c['passed'] is True for c in desktop['keyboard_cases'] + desktop['recovery_cases'])
          assert desktop['interactive_windows_display_tested'] is manifest['interactive_windows_display_tested'] is False
          assert desktop['qualified_legal_review'] is manifest['qualified_legal_review'] is False
          assert check['installed_reading_quality_passed'] is True
          assert check['released_v013_reading_upgrade_passed'] is True
          for name in ('reading_quality','spatial_pdf_reading','word_text_boxes','ocr_rotation','ocr_scan_enhancement','ocr_layout_controls','reading_warning_gates','reading_provenance_export'):
              assert manifest[name] is True, name
          assert manifest['quality_profile'] == 'initial-reading-quality-v1'
          assert manifest['ocr_processing_profile'] == 'complyph-raster-1'
          quality = check['reading_quality']
          assert quality['profile'] == manifest['quality_profile']
          assert quality['private_schema'] == 6 and quality['public_schema'] == 5
          assert manifest['quality_workflow_cases'] == len(quality['workflow_cases']) == 6
          assert {case['name'] for case in quality['workflow_cases']} == {'spatial_pdf_and_fonts','word_text_boxes_and_omissions','local_ocr_processing','numeric_review_quality_gates','reading_history_and_local_exports','offline_originals_and_source_boundary'}
          assert all(case['passed'] is True for case in quality['workflow_cases'])
          for name in ('installed_spatial_pdf_passed','installed_word_text_boxes_passed','installed_font_image_warnings_passed','installed_ocr_options_passed','installed_rotation_enhancement_passed','installed_reading_warning_gates_passed','installed_reading_history_passed','installed_reading_pdf_provenance_passed','quality_originals_preserved','quality_public_catalog_preserved'):
              assert quality['checks'][name] is True, name
          expected_quality = json.loads(Path('examples/expected-reading-quality.json').read_text())
          assert manifest['synthetic_quality_fixture_count'] == quality['synthetic_quality_fixture_count'] == expected_quality['fixture_count'] == 12
          for name, key, engine in (('reader_results','reader_cases','complyph-text-2'),('ocr_results','ocr_cases','complyph-ocr-2')):
              cases = quality[name]
              assert len(cases) == len(expected_quality[key])
              assert {case['name'] for case in cases} == set(expected_quality[key])
              for case in cases:
                  expected_case = expected_quality[key][case['name']]
                  assert case['passed'] is True and case['engine'] == engine
                  assert case['outcomes'] == expected_case['outcomes']
                  if key == 'ocr_cases':
                      assert case['options'] == expected_case['options'] and case['pages'] == expected_case['pages']
          upgrade = check['reading_upgrade']
          assert upgrade['passed'] is True and upgrade['private_schema'] == 6 and upgrade['public_schema'] == 5
          assert upgrade['old_engine'] == 'complyph-ocr-1' and upgrade['new_engine'] == 'complyph-ocr-2' and upgrade['retained_readings'] == 2
          for name in ('old_reports_preserved','old_warning_context_preserved','old_cached_reading_reused','source_catalog_preserved','originals_preserved'):
              assert upgrade[name] is True, name
          assert check['installed_document_revisions_passed'] is True
          assert check['released_v012_history_upgrade_passed'] is True
          for name in ('document_version_history','retained_document_readings','document_version_comparison','finding_comparison','comparison_pdf_export','comparison_json_export'):
              assert manifest[name] is True, name
          assert manifest['comparison_engine'] == 'complyph-document-comparison-1'
          revisions = check['document_revisions']
          assert revisions['private_schema'] == 6 and revisions['public_schema'] == 5
          assert manifest['revision_workflow_cases'] == len(revisions['workflow_cases']) == 6
          assert {case['name'] for case in revisions['workflow_cases']} == {'revision_link_and_text_diff','finding_comparison_and_history','same_path_version_retention','missing_statement_and_basis_guards','comparison_exports','migration_and_private_boundary'}
          assert all(case['passed'] is True for case in revisions['workflow_cases'])
          for name in ('installed_revision_linking_passed','installed_retained_readings_passed','installed_document_diff_passed','installed_finding_comparison_passed','installed_version_history_passed','installed_status_separation_passed','installed_comparison_pdf_passed','installed_comparison_json_passed','installed_revision_guards_passed','installed_revision_migration_passed','revision_originals_preserved','revision_public_catalog_preserved'):
              assert revisions['checks'][name] is True, name
          expected_revisions = json.loads(Path('examples/expected-revisions.json').read_text())
          assert manifest['synthetic_revision_fixture_count'] == revisions['synthetic_revision_fixture_count'] == expected_revisions['fixture_count'] == 5
          assert len(revisions['pair_results']) == 2 and {case['format'] for case in revisions['pair_results']} == {'docx','pdf'}
          for pair in revisions['pair_results']:
              assert pair['changes'] == expected_revisions['corrected_changes']
              assert pair['left_status'] == 'resolved' and pair['right_status'] == 'unresolved'
          assert manifest['reviewer_tracking'] is True and manifest['pdf_export'] is True and manifest['pdf_engine'] == 'complyph-pdf-1'
          for flag in ('installed_review_notes_passed','installed_issue_tracking_passed','installed_pdf_export_passed','review_audit_history_preserved'):
              assert check[flag] is True
          assert manifest['local_ocr'] is True and manifest['folder_monitoring'] is True
          assert manifest['ocr_engine'] == 'complyph-ocr-2' and manifest['ocr_max_pages'] == 20
          assert manifest['rule_engine'] == 'complyph-rules-1'
          assert manifest['synthetic_ocr_fixture_count'] == check['synthetic_ocr_fixture_count'] == 3
          for flag in ('installed_ocr_passed','ocr_confirmation_gate_passed','ocr_originals_preserved','watched_folder_intake_passed','no_auto_review_from_watch_passed'):
              assert check[flag] is True
          expected = json.loads(Path('examples/expected-results.json').read_text())
          assert check['synthetic_fixture_count'] == manifest['synthetic_fixture_count'] == len(expected) == 7
          assert {item['name']: item['status'] for item in check['reader_results']} == {name: value['status'] for name, value in expected.items()}
          checks_expected = json.loads(Path('examples/expected-checks.json').read_text())['expected']
          assert manifest['validated_check_count'] == check['validated_check_count'] == 20
          assert manifest['synthetic_check_fixture_count'] == check['synthetic_check_fixture_count'] == len(checks_expected) == 3
          assert {item['name']: item['outcomes'] for item in check['check_results']} == checks_expected
          sil_expected = json.loads(Path('examples/expected-sil.json').read_text())
          assert manifest['sil_eligibility_gates'] is True
          assert manifest['synthetic_sil_fixture_count'] == check['synthetic_sil_fixture_count'] == len(sil_expected) == 5
          for flag in ('installed_sil_checks_passed', 'sil_eligibility_gates_passed', 'sil_pdf_basis_passed'):
              assert check[flag] is True
          assert {item['name']: item['outcome'] for item in check['sil_results']} == {name: case['outcome'] for name, case in sil_expected.items()}
          initial = json.loads(Path('examples/expected-initial.json').read_text())['cases']
          assert manifest['validated_domain_count'] == 7 and manifest['initial_pack_id'] == 'initial-seven-domain-v1'
          assert manifest['synthetic_initial_fixture_count'] == check['synthetic_initial_fixture_count'] == len(initial) == 5
          assert manifest['rule_pack_sha256'] == check['rule_pack_sha256'] == hashlib.sha256(Path('crates/checks/src/initial_rules.json').read_bytes()).hexdigest()
          for flag in ('installed_initial_checks_passed', 'initial_period_scope_gates_passed', 'installed_initial_source_citations_passed', 'initial_pdf_sources_passed'):
              assert check[flag] is True
          assert {item['name']: item['outcomes'] for item in check['initial_results']} == {name: case['outcomes'] for name,case in initial.items()}
          assert manifest['workspace_default'] == r'C:\ProgramData\ComplyPH'
          for line in (root / 'SHA256SUMS.txt').read_text().splitlines():
              digest, name = line.split('  ', 1)
              path = root / name
              assert path.parent == root
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest, name
          for artifact in manifest['artifacts']:
              path = root / artifact['name']
              assert path.parent == root and path.stat().st_size == artifact['bytes']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == artifact['sha256']
          with zipfile.ZipFile(root / f'ComplyPH-Windows-x64-{version}.zip') as package:
              assert package.testzip() is None
              names = [name for name in package.namelist() if name.endswith('/ComplyPH.exe')]
              assert len(names) == 1
              data = package.read(names[0])
              pe = struct.unpack_from('<I', data, 0x3c)[0]
              assert data[pe:pe+4] == b'PE\0\0'
              assert struct.unpack_from('<H', data, pe+4)[0] == 0x8664
              assert struct.unpack_from('<H', data, pe+24+68)[0] == 2
              ocr = [name for name in package.namelist() if name.endswith('/OCR/runtime-manifest.json')]
              assert len(ocr) == 1
              prefix = ocr[0].removesuffix('runtime-manifest.json')
              runtime = json.loads(package.read(ocr[0]).decode('utf-8-sig'))
              assert runtime['network_features'] is False and runtime['tesseract'] == '5.5.4'
              assert runtime['model_sha256'] == '7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2'
              for item in runtime['files']:
                  assert '/' not in item['name'] and chr(92) not in item['name']
                  assert hashlib.sha256(package.read(prefix + item['name'])).hexdigest() == item['sha256']
              import sys
              sys.path.insert(0, 'scripts')
              from verify_ocr_runtime import verify
              verify({item['name']: package.read(prefix + item['name']) for item in runtime['files']})
              for basename, source in (('Desktop-quality.md','docs/DESKTOP_QUALITY.md'),('Reading-quality.md','docs/READING_QUALITY.md'),('Reports-and-revisions.md','docs/REPORTS.md'),('Library-maintenance.md','docs/LIBRARY_MAINTENANCE.md')):
                  matches = [name for name in package.namelist() if name.endswith('/' + basename)]
                  assert len(matches) == 1 and package.read(matches[0]) == Path(source).read_bytes()
              for sample in [path.name for path in Path('examples').iterdir() if path.is_file()]:
                  matches = [name for name in package.namelist() if name.endswith('/Samples/' + sample)]
                  assert len(matches) == 1
                  assert package.read(matches[0]) == (Path('examples') / sample).read_bytes()
              helper = [name for name in package.namelist() if name.endswith('/complyph-updater.exe')]
              assert len(helper) == 1
          report = root / 'windows-install-check.json'
          with (root / 'SHA256SUMS.txt').open('a', encoding='ascii') as output:
              output.write(hashlib.sha256(report.read_bytes()).hexdigest() + '  ' + report.name + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('RELEASE_VERSION=' + version + '\n')
              output.write('RELEASE_TAG=v' + version + '\n')
          PY
      - name: Prepare a draft release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish > existing-release.json 2>/dev/null; then
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads(Path('existing-release.json').read_text())
          assert release['isDraft'] is True
          assert release['targetCommitish'] == os.environ['EXPECTED_COMMIT']
          PY
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$EXPECTED_COMMIT" --draft --title "ComplyPH $RELEASE_VERSION — Desktop quality improvements" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
      - name: Attach verified packages
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "release/ComplyPH-Setup-$RELEASE_VERSION.exe" \
            "release/ComplyPH-Windows-x64-$RELEASE_VERSION.zip" \
            release/SHA256SUMS.txt release/release-manifest.json \
            release/starter-library-manifest.json release/windows-install-check.json
      - name: Confirm assets and publish
        shell: bash
        run: |
          set -euo pipefail
          # GitHub can briefly omit a just-created draft from its release list.
          for attempt in 1 2 3 4 5 6; do
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > candidate-releases.json
            if python3 -c 'import json,os; data=json.load(open("candidate-releases.json")); raise SystemExit(0 if sum(r["tag_name"] == os.environ["RELEASE_TAG"] for page in data for r in page) == 1 else 1)'; then
              break
            fi
            sleep 5
          done
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          releases = [release for page in json.loads(Path('candidate-releases.json').read_text()) for release in page if release['tag_name'] == os.environ['RELEASE_TAG']]
          assert len(releases) == 1
          release = releases[0]
          assert release['draft'] is True and release['target_commitish'] == os.environ['EXPECTED_COMMIT']
          expected = {path.name: path for path in Path('release').iterdir() if path.is_file()}
          assert {asset['name'] for asset in release['assets']} == set(expected)
          for asset in release['assets']:
              path = expected[asset['name']]
              assert asset['state'] == 'uploaded' and asset['size'] == path.stat().st_size
              if asset.get('digest'):
                  assert asset['digest'] == 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest()
          PY
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
